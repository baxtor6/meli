# HorizontalPodAutoscaler.
# - minReplicas 6 (2 por AZ en 3 AZs) -> tolera la caida de una zona completa.
# - maxReplicas 60 -> dimensionado para el pico de 10,000 req/s asumiendo
#   ~170 req/s por pod (coincide con api_min/api_max_replicas en variables.tf).
# - Escala por utilizacion de CPU (metrics-server). behavior limita el
#   flapping en scale-down y permite subir rapido ante picos.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seller-dashboard-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seller-dashboard-api
  minReplicas: 6
  maxReplicas: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 10
          periodSeconds: 30
      selectPolicy: Max
