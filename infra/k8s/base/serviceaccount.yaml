# ServiceAccount del API. El annotation eks.amazonaws.com/role-arn vincula
# este SA con el rol IAM de IRSA definido en terraform/eks.tf
# (aws_iam_role.api_pod_role), de modo que los pods obtienen credenciales
# temporales de AWS sin claves estaticas. El overlay inyecta el ARN real.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seller-dashboard-api
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/seller-dashboard-api-pod-role"
