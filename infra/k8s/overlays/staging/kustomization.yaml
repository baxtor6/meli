apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

# En staging bajamos replicas y recursos para reducir costo.
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: seller-dashboard-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: PodDisruptionBudget
      name: seller-dashboard-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: Ingress
      name: seller-dashboard-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.api.sellerdashboard.io

# El pipeline ejecuta aqui:
#   kustomize edit set image seller-dashboard-api=*:<SHA>
images:
  - name: seller-dashboard-api
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/seller-dashboard-api
    newTag: latest
